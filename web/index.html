<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- No interactive-widget: by default (resizes-visual: Chrome 108+ and Firefox 132+ on Android) the keyboard shrinks only
       the visual viewport, as on iOS Safari, and app/viewport.ts handles both the same way. minimum-scale,
       maximum-scale and user-scalable=no: no zoom, so iOS Safari does not zoom into a field under 16 px and the page
       does not jump when the keyboard opens and closes. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <!-- the four Latin fonts start with the page, so they are there for the first paint (tokens.css: font-display optional) -->
  <link rel="preload" href="./src/styles/fonts/ibm-plex-sans-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./src/styles/fonts/ibm-plex-sans-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./src/styles/fonts/ibm-plex-mono-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./src/styles/fonts/ibm-plex-mono-700.woff2" as="font" type="font/woff2" crossorigin>
  <!-- the icon: the banner's d on an --ink tile, the same in both themes (the build hashes the files, as the fonts') -->
  <link rel="icon" href="./src/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="./src/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./src/icons/apple-touch-icon.png">
  <title>dofile</title>
  <!-- the theme the visitor chose (app/theme.js), before the first paint, so a dark page does not flash light -->
  <script>try { const t = localStorage.getItem("dofile.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}</script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
