<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- No interactive-widget: by default (resizes-visual: Chrome 108+ and Firefox 132+ on Android) the keyboard shrinks only
       the visual viewport, as on iOS Safari, and app/viewport.js handles both the same way. No maximum-scale or
       user-scalable: pinch zoom stays. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>dofile</title>
  <!-- the theme the visitor chose (app/theme.js), before the first paint, so a dark page does not flash light -->
  <script>try { const t = localStorage.getItem("dofile.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}</script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
