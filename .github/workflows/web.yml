name: web

# The web demo (web/): the engine in Pyodide, the page, the memory snapshot. The Python suite is ci.yml.
# Pull requests and pushes to main both run all jobs. The run on main tests what the merge made: a pull request may be
# merged from a branch that is behind main (the ruleset does not require it to be up to date), and a merge commit is a
# tree no pull request ran. deploy.yml does not wait for this run.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push to a pull request replaces that pull request's run. A push to main (or a manual run) has a group of its
  # own, by commit, so it is never cancelled and never waits behind another: every merge gets a finished result.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

env:
  UV_PYTHON: "3.14"   # Pyodide 314's Python; `npm run wheel` builds the dofile wheel with uv

# A pull request that changes none of the files these tests cover (web/, src/ (the engine the wheel is built from),
# pyproject.toml, uv.lock, this workflow) skips the test
# jobs but still starts the workflow, so the required check `web ok` reports. (A workflow-level `paths` filter starts
# nothing, and a required check that never reports blocks the merge forever.)
# The memory snapshot job has its own, narrower list (`engine`): what the snapshot is built from and what its checks read.
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}   # "false" only for a pull request that changes none of: web/, src/ (the engine the wheel is built from), pyproject.toml, uv.lock, this workflow
      engine: ${{ steps.diff.outputs.engine }}   # "false" only for a pull request that changes none of the snapshot job's inputs (ENGINE below)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          # the snapshot job's inputs: the dofile wheel (src/, pyproject.toml, uv.lock), the extra wheels, the Pyodide version
          # (package.json, package-lock.json), the scripts that build, boot and check it, the engine code its tests start
          # (web/src/engine/), the tests that need it, and the corpus and Stata cases check-snapshot runs
          ENGINE: '^(src|tests/conformance|tests_opendta|web/wheels|web/src/engine)/|^web/scripts/(make-snapshot\.mjs|check-snapshot\.mjs|snapshot-node\.ts|install-engine\.ts|build-id\.ts)$|^web/test/((engine|snapshot-native)\.test|harness)\.ts$|^(pyproject\.toml|uv\.lock|web/package\.json|web/package-lock\.json|\.github/workflows/web\.yml)$'
        run: |
          code=true
          engine=true
          if [ "$EVENT" = pull_request ]; then
            all=$(git diff --name-only "origin/$BASE...HEAD")   # the whole PR, not the last commit; a failure stops the job (red)
            files=$(printf '%s\n' "$all" | grep -vE '\.md$' || true)   # a markdown file never counts
            hit=$(printf '%s\n' "$files" | grep -E '^(web|src)/|^(pyproject\.toml|uv\.lock|\.github/workflows/web\.yml)$' || true)   # files outside the pattern are not covered by these tests
            [ -n "$hit" ] || code=false
            [ -n "$(printf '%s\n' "$files" | grep -E "$ENGINE" || true)" ] || engine=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "engine=$engine" >> "$GITHUB_OUTPUT"

  unit:
    name: types, unit tests, build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check   # biome check (errors only), then tsc --noEmit
      - run: npm run commands   # regenerate the highlighter's command list from the engine's registry ...
      - run: git diff --exit-code -- src/stata/commands.json   # ... it must match what is committed
      - run: npm test   # builds the wheel, then node --test: the worker and client in Node, the shim, inflate/unpack
      - run: npm run build   # vite build

  # Biome (web/biome.json): the format, the import order and the lint rules. Warnings fail here too; locally
  # (`npm run check`, the dev server, a build) only errors do. Also on a push to main. The fix: `npm run format`.
  lint:
    name: format and lint (Biome)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint:strict   # biome ci --error-on-warnings

  e2e:
    name: browsers (Playwright, ${{ matrix.project }})
    needs: changes
    if: needs.changes.outputs.code == 'true'   # always 'true' on a push to main
    runs-on: ubuntu-latest
    timeout-minutes: 30   # a project takes well under 10 minutes; GitHub's default limit is 6 hours
    # One job per Playwright project, each on its own runner with Playwright's default workers (2 on this runner): the four
    # run side by side, and no runner carries more load than the single job did (more workers on one runner would: the
    # WebKit projects are sensitive to it). The iphone project is WebKit with a phone profile. A failed project does not
    # stop the others. `web ok` needs every one of them: it reads this job's joined result.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chromium, browser: chromium }
          - { project: firefox, browser: firefox }
          - { project: webkit, browser: webkit }
          - { project: iphone, browser: webkit }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      # builds the snapshot (the page's default start; needs the network once: micropip fetches openpyxl from PyPI) and the page,
      # then this job's project against `vite preview`. Quality 5: a build in seconds instead of
      # minutes, about 25% bigger; the tests don't depend on the size. One test starts the page with ?snapshot=0 (the normal boot).
      - run: npm run e2e -- --project=${{ matrix.project }}
        env:
          SNAPSHOT_QUALITY: "5"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results-${{ matrix.project }}
          path: web/test-results

  snapshot:
    name: memory snapshot
    needs: changes
    if: needs.changes.outputs.engine == 'true'   # always 'true' on a push to main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # needs the network once: micropip fetches openpyxl from PyPI. Quality 5: seconds instead of ~3 min, about 25% bigger. The
      # tests below read the decompressed bytes, which are the same at any quality; deploy.yml builds the shipped one at 11.
      - run: npm run snapshot
        env:
          SNAPSHOT_QUALITY: "5"
      - run: npm test   # with a snapshot built, snapshot-native.test.mjs runs too instead of skipping
      # the corpus, probes and the Stata 14 cases from the restored engine (~4 min locally; the runner is slower, so a
      # longer limit per case: 1908 and 1909 took over 300 s)
      - run: npm run check-snapshot -- --timeout 900

  # The one check to require in branch protection: it fails if any job failed or was cancelled; skipped jobs are fine.
  ok:
    name: web ok
    if: always()
    needs: [changes, unit, lint, e2e, snapshot]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
