name: web

# The web demo (web/): the engine in Pyodide, the page, the memory snapshot. The Python suite is ci.yml.
# Pull requests run all jobs. A push to main runs only the fast one (`unit`); e2e and snapshot are not repeated after the
# merge (branch protection: require up-to-date branches).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

env:
  UV_PYTHON: "3.14"   # Pyodide 314's Python; `npm run wheel` builds the dofile wheel with uv

jobs:
  unit:
    name: types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check   # tsc --noEmit
      - run: npm run commands   # regenerate the highlighter's command list from the engine's registry ...
      - run: git diff --exit-code -- src/stata/commands.json   # ... it must match what is committed
      - run: npm test   # builds the wheel, then node --test: the worker and client in Node, the shim, inflate/unpack
      - run: npm run build   # vite build

  e2e:
    name: browsers (Playwright)
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run e2e   # builds, then Chromium, Firefox, WebKit and an iPhone profile against `vite preview`
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: web/test-results

  snapshot:
    name: memory snapshot
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run snapshot   # needs the network once: micropip fetches openpyxl from PyPI
      - run: npm test   # with a snapshot built, snapshot-native.test.mjs runs too instead of skipping
      # the corpus, probes and the Stata 14 cases from the restored engine (~4 min locally; the runner is slower, so a
      # longer limit per case: 1908 and 1909 took over 300 s)
      - run: npm run check-snapshot -- --timeout 900
