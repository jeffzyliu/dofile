name: web

# The web demo (web/): the engine in Pyodide, the page, the memory snapshot. The Python suite is ci.yml.
# Pull requests run all jobs. A push to main runs only the fast one (`unit`); e2e and snapshot are not repeated after the
# merge (branch protection: require up-to-date branches).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

env:
  UV_PYTHON: "3.14"   # Pyodide 314's Python; `npm run wheel` builds the dofile wheel with uv

# A docs-only pull request skips the test jobs but still starts the workflow, so the required check `web ok` reports. (A
# workflow-level `paths-ignore` starts nothing, and a required check that never reports blocks the merge forever.)
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}   # "false" only for a pull request that changes nothing but *.md, docs/, release.yml and lint.yml
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only "origin/$BASE...HEAD")   # the whole PR, not the last commit; a failure stops the job (red)
            other=$(printf '%s\n' "$files" | grep -vE '\.md$|^docs/|^\.github/workflows/(release|lint)\.yml$' || true)   # files that are not docs (release.yml runs only on a tag push and lint.yml is a linter: no test covers them)
            [ -n "$other" ] || code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  unit:
    name: types, unit tests, build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check   # tsc --noEmit
      - run: npm run commands   # regenerate the highlighter's command list from the engine's registry ...
      - run: git diff --exit-code -- src/stata/commands.json   # ... it must match what is committed
      - run: npm test   # builds the wheel, then node --test: the worker and client in Node, the shim, inflate/unpack
      - run: npm run build   # vite build

  e2e:
    name: browsers (Playwright)
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      # builds the snapshot (the page's default start; needs the network once: micropip fetches openpyxl from PyPI) and the page,
      # then Chromium, Firefox, WebKit and an iPhone profile against `vite preview`. Quality 5: a build in seconds instead of
      # minutes, about 25% bigger; the tests don't depend on the size. One test starts the page with ?snapshot=0 (the normal boot).
      - run: npm run e2e
        env:
          SNAPSHOT_QUALITY: "5"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: web/test-results

  snapshot:
    name: memory snapshot
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run snapshot   # needs the network once: micropip fetches openpyxl from PyPI
      - run: npm test   # with a snapshot built, snapshot-native.test.mjs runs too instead of skipping
      # the corpus, probes and the Stata 14 cases from the restored engine (~4 min locally; the runner is slower, so a
      # longer limit per case: 1908 and 1909 took over 300 s)
      - run: npm run check-snapshot -- --timeout 900

  # The one check to require in branch protection: it fails if any job failed or was cancelled; skipped jobs are fine.
  ok:
    name: web ok
    if: always()
    needs: [changes, unit, e2e, snapshot]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
