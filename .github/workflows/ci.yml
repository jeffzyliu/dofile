name: ci

# Pull requests run the full matrix. A push to main runs only `quick`; the matrix is not repeated after the merge
# (branch protection: require up-to-date branches).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# A pull request that changes none of the files these tests cover (src/, tests/, tests_opendta/, scripts/,
# pyproject.toml, uv.lock, .python-version, this workflow) skips the test
# jobs but still starts the workflow, so the required check `ci ok` reports. (A workflow-level `paths` filter starts
# nothing, and a required check that never reports blocks the merge forever.)
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}   # "false" only for a pull request that changes none of: src/, tests/, tests_opendta/, scripts/, pyproject.toml, uv.lock, .python-version, this workflow
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only "origin/$BASE...HEAD")   # the whole PR, not the last commit; a failure stops the job (red)
            hit=$(printf '%s\n' "$files" | grep -vE '\.md$' | grep -E '^(src|tests|tests_opendta|scripts)/|^(pyproject\.toml|uv\.lock|\.python-version|\.github/workflows/ci\.yml)$' || true)   # a markdown file never counts; files outside the pattern are not covered by these tests
            [ -n "$hit" ] || code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  quick:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.14"   # pinned here, not left to .python-version; also reaches poe's nested `uv run`
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --extra mcp
      - run: uv run poe test   # ~35 s; skips the slow Stata comparison

  test:
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 3.12: floor (OpenDTA's own CI); 3.14: dev default and Pyodide 314's Python
        python: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    env:
      # poe runs tasks through a nested `uv run`, which would otherwise pick .python-version (3.14)
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --extra mcp
      - run: uv run poe ci   # everything, including the slow Stata comparison

  # The one check to require in branch protection: it fails if any job failed or was cancelled; skipped jobs are fine.
  ok:
    name: ci ok
    if: always()
    needs: [changes, quick, test]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
