name: ci

# Pull requests and pushes to main both run the full matrix. The run on main tests what the merge made: a pull request
# may be merged from a branch that is behind main (the ruleset does not require it to be up to date), and a merge commit
# is a tree no pull request ran.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push to a pull request replaces that pull request's run. A push to main (or a manual run) has a group of its
  # own, by commit, so it is never cancelled and never waits behind another: every merge gets a finished result.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

# A pull request that changes none of the files these tests cover (src/, tests/, tests_opendta/, scripts/, web/sample/,
# pyproject.toml, uv.lock, .python-version, this workflow) skips the test
# jobs but still starts the workflow, so the required check `ci ok` reports. (A workflow-level `paths` filter starts
# nothing, and a required check that never reports blocks the merge forever.)
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}   # "false" only for a pull request that changes none of: src/, tests/, tests_opendta/, scripts/, web/sample/ (tests/test_sample_data.py), pyproject.toml, uv.lock, .python-version, this workflow
      python: ${{ steps.diff.outputs.python }}   # "false" only for a pull request that changes none of the above and no web/scripts/*.py: what ruff checks
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          code=true
          python=true
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only "origin/$BASE...HEAD")   # the whole PR, not the last commit; a failure stops the job (red)
            hit=$(printf '%s\n' "$files" | grep -vE '\.md$' | grep -E '^(src|tests|tests_opendta|scripts|web/sample)/|^(pyproject\.toml|uv\.lock|\.python-version|\.github/workflows/ci\.yml)$' || true)   # a markdown file never counts; files outside the pattern are not covered by these tests
            [ -n "$hit" ] || code=false
            py=$(printf '%s\n' "$files" | grep -E '^web/scripts/.*\.py$' || true)   # ruff's files that the tests do not cover
            [ -n "$hit$py" ] || python=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "python=$python" >> "$GITHUB_OUTPUT"

  # ruff ([tool.ruff] in pyproject.toml) over dofile's own Python, never the vendored engine: the format, then the lint
  # rules. Also on a push to main. The fix: `uv run poe format`.
  lint:
    name: format and lint (ruff)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --extra mcp
      - run: uv run poe lint   # ruff format --check, then ruff check

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'   # always 'true' on a push to main
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 3.12: floor (OpenDTA's own CI); 3.14: dev default and Pyodide 314's Python
        python: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    env:
      # poe runs tasks through a nested `uv run`, which would otherwise pick .python-version (3.14)
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --extra mcp
      - run: uv run poe ci   # everything, including the slow Stata comparison

  # The one check to require in branch protection: it fails if any job failed or was cancelled; skipped jobs are fine.
  ok:
    name: ci ok
    if: always()
    needs: [changes, lint, test]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
