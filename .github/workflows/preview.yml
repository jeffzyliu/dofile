name: preview

# A preview of the web demo for each pull request from a branch of this repo: both builds, linked to each other's preview
# address, uploaded as a version of each Worker under the alias pr-<N> (not deployed: production does not change), checked,
# and one comment on the pull request with the two addresses, updated on each push:
#   https://pr-<N>-dofile-app.<subdomain>.workers.dev/   the editor (wrangler.app.jsonc)
#   https://pr-<N>-dofile.<subdomain>.workers.dev/       the landing and commands pages (wrangler.jsonc)
# <subdomain> is the repository variable CLOUDFLARE_WORKERS_SUBDOMAIN. Not for forks or Dependabot (no secrets; never
# pull_request_target), not a required check, does not wait for the tests. Setup, limits and what is unverified:
# docs/deploying.md, sections 4 and "How the workflows work".
on:
  pull_request:
    paths:   # what the two builds are made from; a pull request that changes none of it keeps its last preview
      - "web/**"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/actions/build-web/**"
      - ".github/workflows/preview.yml"
      - "!**/*.md"

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  upload:
    name: build and upload
    # not a fork's, and not a Dependabot pull request, also when a maintainer pushes to it ("Update branch")
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.urls.outputs.site }}
      editor: ${{ steps.urls.outputs.editor }}
    steps:
      # Worked out before the build, which bakes them in. The Worker names are the two Wrangler configs'.
      - id: urls
        name: The preview addresses
        env:
          N: ${{ github.event.pull_request.number }}
          SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
        run: |
          if ! printf '%s' "$SUBDOMAIN" | grep -qE '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'; then
            echo "::error::Set the repository variable CLOUDFLARE_WORKERS_SUBDOMAIN to the account's workers.dev subdomain (the <subdomain> in <worker>.<subdomain>.workers.dev), got '$SUBDOMAIN'"
            exit 1
          fi
          {
            echo "alias=pr-$N"
            echo "site=https://pr-$N-dofile.$SUBDOMAIN.workers.dev/"
            echo "editor=https://pr-$N-dofile-app.$SUBDOMAIN.workers.dev/"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-web
        with:
          site-url: ${{ steps.urls.outputs.site }}
          editor-url: ${{ steps.urls.outputs.editor }}
      # The project's own wrangler (package-lock). The secrets are in this step's environment only, not the build's.
      - name: Upload a version of each Worker, not deployed
        working-directory: web
        env:
          ALIAS: ${{ steps.urls.outputs.alias }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --no-install wrangler versions upload --config wrangler.app.jsonc --preview-alias "$ALIAS"
          npx --no-install wrangler versions upload --preview-alias "$ALIAS"
      # Both addresses answer 200, the landing page links to this preview's editor, and the editor is cross-origin isolated
      # (a wrong subdomain variable fails here too).
      - name: The previews answer as they should
        working-directory: web
        env:
          SITE: ${{ steps.urls.outputs.site }}
          EDITOR: ${{ steps.urls.outputs.editor }}
        run: node scripts/smoke.ts "$SITE" "$EDITOR"

  # A job of its own, so the token that may write to the pull request never shares a runner with the pull request's code.
  comment:
    name: comment the addresses
    needs: upload
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - shell: bash   # pipefail: a failed lookup must stop the step, not post a second comment
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          EDITOR: ${{ needs.upload.outputs.editor }}
          SITE: ${{ needs.upload.outputs.site }}
        run: |
          marker='<!-- dofile-preview -->'
          body=$(printf '%s\n' "$marker" \
            "Preview of $HEAD merged with the base branch (not production; this comment is updated on each push):" \
            "" \
            "- Editor: $EDITOR" \
            "- Landing and commands pages: $SITE")
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$N/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | sed -n 1p)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$N/comments" -f body="$body" > /dev/null
          fi
