name: deploy

# A push to main: the three test workflows on this commit, then, only if all three passed and the commit is still the tip
# of main, the web demo's two Cloudflare Workers: the editor (web/wrangler.app.jsonc, app.dofile.dev) and the landing and
# commands pages (web/wrangler.jsonc, dofile.dev). Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID. Why the tip is
# checked twice, re-runs and manual runs: docs/deploying.md, "How the workflows work".
on:
  push:
    branches: [main]
  workflow_dispatch:   # the same as a push, tests included; on another branch it deploys nothing

permissions:
  contents: read   # the most a job gets, but the three test workflows also read the run's jobs (actions: read)

jobs:
  # Their check names here are "ci / ci ok" and so on; on a pull request they are "ci ok", "web ok", "lint ok".
  ci:
    uses: ./.github/workflows/ci.yml
    permissions: { contents: read, actions: read }   # actions: read for the gate's list of its run's jobs
  web:
    uses: ./.github/workflows/web.yml
    permissions: { contents: read, actions: read }
  lint:
    uses: ./.github/workflows/lint.yml
    permissions: { contents: read, actions: read }

  # Outside the deploy group: a commit that is no longer the tip stops here (green, with a notice), so it never becomes the
  # group's pending job, which would cancel a newer commit's pending deploy.
  latest:
    name: still the tip of main
    needs: [ci, web, lint]   # runs only if all three succeeded
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tip: ${{ steps.tip.outputs.tip }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: if .github/scripts/is-main-tip.sh; then echo "tip=true" >> "$GITHUB_OUTPUT"; elif [ $? -ne 1 ]; then exit 1; fi

  deploy:
    needs: latest
    if: needs.latest.outputs.tip == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false   # a deploy in progress always finishes: the two Workers are never left half deployed
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-web
        with:
          urls: production   # the addresses of web/scripts/urls.ts
      # The tip check again, inside the group (any deploy ahead of this one has finished), right before the deploy; then
      # the project's own wrangler (package-lock). The secrets are in this step's environment only, not the build's.
      - id: deploy
        working-directory: web
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ../.github/scripts/is-main-tip.sh || { [ $? -eq 1 ] && exit 0; exit 1; }
          npx --no-install wrangler deploy --config wrangler.app.jsonc
          npx --no-install wrangler deploy
          echo "deployed=true" >> "$GITHUB_OUTPUT"
      # Fails the run if production does not answer as it should. It cannot roll back: that is a deploy of an earlier
      # commit (docs/deploying.md). The first deploy's certificates can take minutes, hence the long wait.
      - if: steps.deploy.outputs.deployed == 'true'
        working-directory: web
        run: node scripts/smoke.ts --wait 600
