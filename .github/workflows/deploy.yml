name: deploy

# Everything that runs on a push to main: the three test workflows (ci.yml, web.yml, lint.yml, called here, so each runs
# once per commit and on this commit), then, only if all three passed, the deploy of the web demo to two Cloudflare Workers
# as static assets: the editor (web/dist/app, app.dofile.dev: wrangler.app.jsonc) and the landing and commands pages
# (web/dist/site, dofile.dev: wrangler.jsonc). The build is .github/actions/build-web (shared with preview.yml).
# Needs the repo secrets CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers", with the dofile.dev zone in its zone
# resources) and CLOUDFLARE_ACCOUNT_ID. Pull requests are tested by the same three workflows, which they start themselves.
#
# Order of deploys: only the tip of main is deployed. Each commit's tests run side by side with no shared group (a merge
# never waits behind another merge's tests, and none is cancelled), so two quick merges can finish their tests in either
# order. Two checks keep an older commit from landing after a newer one:
# - `latest`, after the tests and outside the deploy group: a commit that is no longer the tip of main stops here (green,
#   with a notice), so it never enters the group, where as the newest pending job it would cancel a newer commit's pending
#   deploy (a group holds one running and one pending job; a new pending job cancels the pending one).
# - the same check again as the deploy job's first step, inside the group (`deploy-production`, never cancelled in
#   progress, so the editor and the site are never left half deployed): it runs after any deploy ahead of it has finished.
# If the newer commit then fails its tests, production stays on the last commit deployed until a later commit passes.
# A deploy that failed on its own (a network error, say) is retried with "Re-run failed jobs": the tests are not run
# again, and the tip check still applies.
#
# By hand (workflow_dispatch): the same as a push, tests included, so nothing reaches production untested; started on
# another branch it runs the tests and deploys nothing.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read   # the most any called workflow gets

jobs:
  # Their check names here are "ci / ci ok" and so on; on a pull request they are "ci ok", "web ok", "lint ok".
  ci:
    uses: ./.github/workflows/ci.yml
  web:
    uses: ./.github/workflows/web.yml
  lint:
    uses: ./.github/workflows/lint.yml

  latest:
    name: still the tip of main
    needs: [ci, web, lint]   # runs only if all three succeeded
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tip: ${{ steps.tip.outputs.tip }}
    steps:
      - id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$main" = "$GITHUB_SHA" ]; then
            echo "tip=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main is at $main now, not $GITHUB_SHA: that commit's own run deploys it"
            echo "tip=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: latest
    if: needs.latest.outputs.tip == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false   # let a running deploy finish; the next one waits
    steps:
      - id: tip
        name: Still the tip of main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$main" = "$GITHUB_SHA" ]; then
            echo "tip=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main is at $main now, not $GITHUB_SHA: that commit's own run deploys it"
          fi
      - if: steps.tip.outputs.tip == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - if: steps.tip.outputs.tip == 'true'
        uses: ./.github/actions/build-web   # no inputs: the production addresses of web/scripts/urls.ts
      - name: Deploy the editor (dofile-app)
        if: steps.tip.outputs.tip == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: deploy --config wrangler.app.jsonc
      - name: Deploy the landing and commands pages (dofile)
        if: steps.tip.outputs.tip == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: deploy
