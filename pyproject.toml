[project]
name = "dofile"
version = "0.1.0.dev0"
description = "Run Stata-syntax .do files without a Stata license; MCP server for agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/dofile/_vendor/opendta/LICENSE", "src/dofile/_vendor/opendta/THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12"  # OpenDTA upstream CI tests 3.12; dofile CI: 3.12, 3.13, 3.14 (dev + Pyodide)
# the vendored OpenDTA engine's runtime dependencies (its Qt GUI is not vendored)
dependencies = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.7", "openpyxl>=3.1"]

[project.optional-dependencies]
legacy-dta = ["pyreadstat>=1.3"]  # .dta files from Stata 12 and earlier
mcp = [
    "mcp==2.3.0",
]

[project.scripts]
dofile = "dofile.cli:main"
dofile-mcp = "dofile.mcp_server:main"

[dependency-groups]
# pandas, pyreadstat, xlrd, xlwt: only OpenDTA's own test suite uses them (its dev extra, same caps)
dev = ["pytest>=8", "pandas>=2", "pyreadstat>=1.3,<1.3.7", "xlrd>=2.0", "xlwt>=1.3"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dofile"]

[tool.hatch.build.targets.sdist]
# Stata 14 output stays in the git repo, never in a distribution (LICENSE-POLICY.md)
exclude = ["tests_opendta/compat/expected"]

[tool.pytest.ini_options]
testpaths = ["tests", "tests_opendta/tests"]
markers = ["slow: the Stata 14 log comparison (~3 min); opt in with -m slow, or -m \"\" for everything"]
addopts = [
  "-m", "not slow",
  # these OpenDTA tests import the Qt GUI inside the test body; the GUI is not vendored
  "--deselect=tests_opendta/tests/test_i18n.py::test_dialog_commands",
  "--deselect=tests_opendta/tests/test_i18n.py::test_dialog_commands_run",
  "--deselect=tests_opendta/tests/test_i18n.py::test_graph_editor_edits",
]
